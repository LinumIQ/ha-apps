---
# Keeps the SHA-pinned GitHub Actions, the panel's hash-pinned Python
# dependencies and the Dockerfile base images current. Each Actions pin carries
# a version comment that Dependabot updates together with the SHA.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # <add-on>/requirements.in (direct pins) -> requirements.txt
  # (pip-compile --generate-hashes; Dependabot re-runs pip-compile with the
  # options recorded in the file's header, so the hashes stay complete). The
  # images run CPython 3.14 (base 21.0.10 = Alpine 3.24): a Dependabot lock
  # made with another Python must be re-checked with the command in the
  # requirements.in header before merging.
  - package-ecosystem: "pip"
    directory: "/frp-tunnel"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/caddy-mtls"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # FROM lines with a literal image (e.g. caddy-mtls' golang builder stage).
  # The Home Assistant base image (currently ghcr.io/hassio-addons/base
  # 21.0.10) comes in through build.yaml / ARG BUILD_FROM, which Dependabot
  # does not resolve - bump it by hand in build.yaml, the Dockerfiles' ARG
  # defaults, the CI/E2E build commands (lint.yml, frp-tunnel/tests/e2e) and
  # the requirements.in headers, and re-lock requirements.txt with it.
  - package-ecosystem: "docker"
    directories:
      - "/frp-tunnel"
      - "/caddy-mtls"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
