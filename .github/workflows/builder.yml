---
name: Builder

# Security (audit M15): no default token permissions (each job asks for what
# it needs), every action pinned by commit SHA, checkout without persisted
# credentials, and expression values reach shell code only through `env:`.
permissions: {}

env:
  # Files/dirs (relative to an add-on directory) whose change rebuilds that
  # add-on; .dockerignore decides what goes into the build context. (Folded:
  # one space-separated line.)
  MONITORED_FILES: >-
    build.yaml config.yaml Dockerfile .dockerignore rootfs
    requirements.in requirements.txt apparmor.txt
  # Repository files whose change rebuilds every add-on (the build itself).
  MONITORED_GLOBAL_FILES: ".github/workflows/builder.yml"
  # home-assistant/builder 2026.03.2, pinned by image digest (amd64 image
  # manifest, 2026-10-27). It is the last builder IMAGE: home-assistant/builder
  # deprecated builder.sh / the image in 2026.03.0 in favour of composable
  # BuildKit actions (actions/build-image etc.; 2026.06.0+ releases contain no
  # image, GHCR has version tags only up to 2026.03.2; `latest`/`dev` are an
  # unreleased dev build). The deprecated home-assistant/builder *action* is
  # only a wrapper around this image and cannot be pinned by commit SHA (it
  # derives the image tag from its own checkout path), so the image is run
  # directly. The flags used below (--test, --docker-hub, --target, --image,
  # --addon, --aarch64/--amd64) are unchanged since 2024.08.2.
  # Base-image signatures: builder.sh verifies BUILD_FROM with cosign only
  # when build.yaml names a `cosign.base_identity`; ghcr.io/hassio-addons/base
  # is not cosign-signed (no signature in the registry), so the add-ons set
  # none and the check is skipped - verification stays enabled (no
  # --no-cosign-verify), it just has nothing to verify.
  BUILDER_IMAGE: "ghcr.io/home-assistant/amd64-builder:2026.03.2"
  BUILDER_DIGEST: "sha256:bb0916d95292d912aaf9a02f0568db336f81d12f6f9b617a93d362efa8bc5d2f"
  # Repository of the images. Always passed: without it (and without an
  # `image:` key in config.yaml, e.g. frp-tunnel) the builder tags the image
  # "/<arch>-addon-<name>:<version>", which docker rejects (this is what made
  # every frp-tunnel build fail).
  IMAGE_REPOSITORY: "ghcr.io/linumiq"

on:
  push:
    branches:
      - main
    paths:
      - "caddy-mtls/**"
      - "frp-tunnel/**"
      - ".github/workflows/builder.yml"
  pull_request:
    branches:
      - main
    paths:
      - "caddy-mtls/**"
      - "frp-tunnel/**"
      - ".github/workflows/builder.yml"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    permissions:
      contents: read
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find add-on directories
        id: addons
        run: |
          # An add-on directory is any top-level dir containing config.yaml or
          # config.json (currently caddy-mtls and frp-tunnel). Output as a
          # space-separated list.
          addons=()
          for cfg in */config.yaml */config.json; do
            [[ -e "${cfg}" ]] || continue
            dir="${cfg%/*}"
            [[ "${dir}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::unexpected add-on dir ${dir}"; exit 1; }
            addons+=("${dir}")
          done
          # De-duplicate (config.yaml and config.json could co-exist).
          mapfile -t addons < <(printf '%s\n' "${addons[@]}" | sort -u)
          echo "addons=${addons[*]}" >> "${GITHUB_OUTPUT}"
          echo "Discovered add-ons: ${addons[*]}"

      # Changed files come from git itself (no third-party action).
      # Releases are per add-on: a release tag "<add-on dir>-v<version>"
      # (e.g. frp-tunnel-v2.3.1, caddy-mtls-v2.0.0) selects ONLY that add-on,
      # and <version> must be the version in its config.yaml (the workflow
      # fails otherwise). Any other tag - e.g. the caddy-mtls release tags
      # v1.1.0 ... v1.2.7 from before frp-tunnel existed - keeps the old
      # behaviour and selects every add-on; the publish job still skips each
      # version that is already in GHCR. workflow_dispatch test-builds every
      # add-on.
      - name: Get changed add-ons
        id: changed_addons
        env:
          EVENT_NAME: ${{ github.event_name }}
          ADDONS: ${{ steps.addons.outputs.addons }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          read -r -a addons <<< "${ADDONS}"
          read -r -a monitored <<< "${MONITORED_FILES}"
          selected=()
          if [[ "${EVENT_NAME}" == "release" ]]; then
            # The add-on whose "<dir>-v" prefixes the tag (the longest such
            # dir name, should one dir name be a prefix of another).
            match=""
            for addon in "${addons[@]}"; do
              if [[ "${RELEASE_TAG}" == "${addon}-v"* && ${#addon} -gt ${#match} ]]; then
                match="${addon}"
              fi
            done
            if [[ -n "${match}" ]]; then
              version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' \
                "${match}/config.yaml" 2>/dev/null | head -n 1 || true)"
              if [[ -z "${version}" || "${RELEASE_TAG}" != "${match}-v${version}" ]]; then
                echo "::error::release tag ${RELEASE_TAG} does not match ${match}/config.yaml" \
                  "(version ${version:-missing}): expected ${match}-v${version:-<version>}"
                exit 1
              fi
              selected=("${match}")
              echo "Release ${RELEASE_TAG}: building and publishing ${match} ${version} only"
            else
              selected=("${addons[@]}")
              echo "Release ${RELEASE_TAG} names no add-on (<add-on>-v<version>): every add-on is selected"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            selected=("${addons[@]}")
          else
            base="${PR_BASE}"
            [[ "${EVENT_NAME}" == "push" ]] && base="${PUSH_BEFORE}"
            if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" =~ ^0+$ ]] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # New branch or unknown base: compare with the parent commit.
              base="$(git rev-parse --verify --quiet "${HEAD_SHA}^" || true)"
            fi
            if [[ -n "${base}" ]]; then
              mapfile -t changed < <(git diff --name-only "${base}" "${HEAD_SHA}")
            else
              mapfile -t changed < <(git ls-files)
            fi
            printf 'Changed files:\n'
            printf '  %s\n' "${changed[@]}"
            read -r -a monitored_global <<< "${MONITORED_GLOBAL_FILES}"
            rebuild_all=false
            for file in "${changed[@]}"; do
              for watched in "${monitored_global[@]}"; do
                if [[ "${file}" == "${watched}" ]]; then
                  rebuild_all=true
                fi
              done
            done
            if [[ "${rebuild_all}" == true ]]; then
              echo "A global build file changed (${MONITORED_GLOBAL_FILES}): rebuilding every add-on"
              selected=("${addons[@]}")
            else
              for addon in "${addons[@]}"; do
                for file in "${changed[@]}"; do
                  hit=false
                  for watched in "${monitored[@]}"; do
                    if [[ "${file}" == "${addon}/${watched}" || "${file}" == "${addon}/${watched}/"* ]]; then
                      hit=true
                    fi
                  done
                  if [[ "${hit}" == true ]]; then
                    selected+=("${addon}")
                    break
                  fi
                done
              done
            fi
          fi
          if (( ${#selected[@]} > 0 )); then
            json="$(printf '"%s",' "${selected[@]}")"
            echo "Changed add-ons: ${selected[*]}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "addons=[${json%,}]" >> "${GITHUB_OUTPUT}"
          else
            echo "No add-on had any monitored files changed (${MONITORED_FILES} ${MONITORED_GLOBAL_FILES})"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  # Test build of every changed add-on (push / pull request / manual run).
  # NOTE: do NOT add `docker/setup-buildx-action`: it switches buildx to the
  # `docker-container` driver, which leaves build results only in the build
  # cache, and the builder's subsequent `docker tag` fails with `No such image`.
  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true' && github.event_name != 'release'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test-build ${{ matrix.addon }} (${{ matrix.arch }})
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "${GITHUB_WORKSPACE}:/data" \
            "${BUILDER_IMAGE}@${BUILDER_DIGEST}" \
            --test \
            --docker-hub "${IMAGE_REPOSITORY}" \
            "--${ARCH}" \
            --target "/data/${ADDON}" \
            --image "{arch}-addon-${ADDON}" \
            --addon

  # On a published GitHub release the add-on(s) selected by the release tag
  # (see init) are built and pushed to ghcr.io/linumiq/{arch}-addon-<dir>:
  # <version> (e.g. amd64-addon-frp-tunnel:2.3.1) - unless that version is
  # already there. An add-on uses the published image only once its
  # config.yaml sets `image:` (frp-tunnel does not yet, so Supervisor builds
  # it from the Dockerfile).
  publish:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true' && github.event_name == 'release'
    name: Publish ${{ matrix.arch }} ${{ matrix.addon }} add-on
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A published version is never overwritten (a re-run, overlapping
      # releases, or a tag that selects every add-on): HEAD of the version's
      # manifest in the registry, with a pull token from ghcr.io/token
      # requested with the job's GITHUB_TOKEN (credentials go to curl on
      # stdin, never in argv). 200 = published -> skip this add-on/arch (the
      # job succeeds); 404 = not published -> build and push. 401/403 = no
      # such package yet, or not readable with this token -> asked again
      # anonymously, which answers 200 for a published public image. Any
      # other answer (network error, 5xx) fails the job instead of risking an
      # overwrite.
      - name: Check whether ${{ matrix.addon }} (${{ matrix.arch }}) is already published
        id: published
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' \
            "${ADDON}/config.yaml" 2>/dev/null | head -n 1 || true)"
          if [[ ! "${version}" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::no valid version in ${ADDON}/config.yaml"
            exit 1
          fi
          repo="${IMAGE_REPOSITORY#ghcr.io/}/${ARCH}-addon-${ADDON}"
          ref="ghcr.io/${repo}:${version}"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json"
          accept="${accept},application/vnd.docker.distribution.manifest.list.v2+json"
          accept="${accept},application/vnd.docker.distribution.manifest.v2+json"
          # head_manifest <auth|anon>: HTTP status of HEAD manifests/<version>,
          # or the token endpoint's status when it issues no token.
          head_manifest() {
            local cfg="" body status token
            [[ "$1" == auth ]] && cfg="user = \"${REGISTRY_USER}:${REGISTRY_TOKEN}\""
            body="$(mktemp)"
            status="$(printf '%s\n' "${cfg}" | curl -sS -o "${body}" -w '%{http_code}' --max-time 30 \
              --config - "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull")" || status=000
            token="$(jq -r '.token // empty' "${body}" 2>/dev/null || true)"
            rm -f "${body}"
            if [[ "${status}" != 200 || -z "${token}" ]]; then
              echo "${status}"
              return
            fi
            curl -sS -o /dev/null -I -w '%{http_code}' --max-time 30 -H "Accept: ${accept}" \
              -H @<(printf 'Authorization: Bearer %s\n' "${token}") \
              "https://ghcr.io/v2/${repo}/manifests/${version}" || true
          }
          code="$(head_manifest auth)"
          if [[ "${code}" == 401 || "${code}" == 403 ]]; then
            code="$(head_manifest anon)"
          fi
          case "${code}" in
            200)
              echo "${ref} is already published, skipping (a published version is never overwritten)"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              ;;
            401 | 403 | 404)
              echo "${ref} is not published yet (registry answered ${code}): building and pushing"
              echo "skip=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::cannot tell whether ${ref} is already published (registry answered ${code}); not pushing"
              exit 1
              ;;
          esac

      - name: Login to GitHub Container Registry
        if: steps.published.outputs.skip == 'false'
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USER}" --password-stdin

      - name: Build and push ${{ matrix.addon }} (${{ matrix.arch }})
        if: steps.published.outputs.skip == 'false'
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "${HOME}/.docker:/root/.docker" \
            -v "${GITHUB_WORKSPACE}:/data" \
            "${BUILDER_IMAGE}@${BUILDER_DIGEST}" \
            --docker-hub "${IMAGE_REPOSITORY}" \
            "--${ARCH}" \
            --target "/data/${ADDON}" \
            --image "{arch}-addon-${ADDON}" \
            --addon

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
