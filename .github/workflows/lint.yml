---
name: Lint

# Security (audit M15): no default token permissions (each job gets read-only
# contents), every action pinned by commit SHA, checkout without persisted
# credentials, and expression values reach shell code only through `env:`.
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (${{ matrix.addon }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        addon: ["caddy-mtls", "frp-tunnel"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Kept at v3.1.0 (hadolint 2.12): hadolint 2.15 (action v3.5.0) newly
      # flags caddy-mtls' shell-form HEALTHCHECK (DL3025) - bump the action
      # together with that change.
      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.addon }}/Dockerfile

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Scans every shell script of both add-ons: *.sh (helper libraries,
      # frp-tunnel/tests/e2e/run.sh) and - via additional_files - the s6
      # `run`/`finish` scripts. Those have no extension, are mode 644 in git
      # and use the `with-contenv bashio` / `execlineb` shebangs, so the
      # action's own shebang detection skips them.
      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # SC1008: bashio / execlineb shebangs are not recognised (-s bash
          #         parses every file as bash)
          # SC1083: s6 'finish' scripts are execlineb ('foreground { ... }')
          # SC1091: sourced files use absolute /etc/... paths
          # SC2016: jq programs intentionally use single quotes
          SHELLCHECK_OPTS: -e SC1008,SC1083,SC1091,SC2016 -s bash
        with:
          version: v0.11.0
          ignore_paths: ".git"
          additional_files: "run finish"

  yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run YAMLLint
        uses: frenck/action-yamllint@34b4bbcaeabedcfefad6adea8c5bbc42af0e2d47 # v1.5.0
        with:
          strict: true

  addon-config:
    name: Add-on configuration (${{ matrix.addon }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        addon: ["caddy-mtls", "frp-tunnel"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.addon }}"

  frp-tunnel-python:
    name: FRP Tunnel Python (compile + unit tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same CPython minor version as the add-on image (Alpine 3.23: 3.12).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile
        run: >-
          python -m py_compile
          frp-tunnel/rootfs/usr/lib/frp-mgr/app.py
          frp-tunnel/rootfs/usr/lib/frp-mgr/config.py
          frp-tunnel/rootfs/usr/lib/frp-mgr/frpclog.py
          frp-tunnel/tests/e2e/approve.py

      # The panel's pinned, hash-checked dependencies (the same
      # requirements.txt the image installs), so the panel flow tests run
      # here too (FRP_TESTS_REQUIRE_PANEL=1: a missing dependency fails).
      - name: Install the panel dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --require-hashes --only-binary=:all: -r frp-tunnel/requirements.txt

      - name: Unit tests
        env:
          FRP_TESTS_REQUIRE_PANEL: "1"
        run: python -m unittest discover -s frp-tunnel/tests/unit -v

  frp-tunnel-image:
    name: FRP Tunnel image (amd64 build, unit tests inside, AppArmor smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same build as Supervisor / the E2E harness; also verifies the pinned
      # frp tarball checksum and the hashes of the Python dependencies.
      - name: Build the amd64 image
        run: >-
          docker build
          --build-arg BUILD_FROM=ghcr.io/hassio-addons/base:20.1.0
          --build-arg BUILD_ARCH=amd64
          -t frp-tunnel-test
          frp-tunnel

      # Runs every unit test (incl. the panel flows in test_app.py) with the
      # image's virtualenv against the INSTALLED panel code (FRP_MGR_DIR).
      - name: Unit tests inside the image
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}/frp-tunnel/tests:/tests:ro"
          -e FRP_MGR_DIR=/usr/lib/frp-mgr
          -e FRP_TESTS_REQUIRE_PANEL=1
          --entrypoint python3
          frp-tunnel-test
          -m unittest discover -s /tests/unit -v

      # Loads apparmor.txt (enforce mode) and boots the image under it:
      # s6-overlay, bashio, the panel and the frpc wait loop must start
      # without a single AppArmor denial.
      - name: AppArmor smoke test
        run: frp-tunnel/tests/apparmor-smoke.sh frp-tunnel-test frp-tunnel/apparmor.txt
