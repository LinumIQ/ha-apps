# Home Assistant Add-on: Caddy mTLS Proxy
# English translations for configuration options

configuration:
  domain:
    name: Domain
    description: >-
      The domain name for your Home Assistant instance (e.g., home.example.com),
      without a port: the public ports stay 80 and 443.
      This domain must point to your Home Assistant's public IP address.
      Let's Encrypt will automatically obtain and renew SSL certificates for this domain.

  email:
    name: Email
    description: >-
      Email address for Let's Encrypt certificate registration.
      You will receive expiration warnings at this address.

  upstream_host:
    name: Upstream Host
    description: >-
      The hostname or IP address of the backend service to proxy to.
      Default is 'homeassistant' which resolves to Home Assistant Core.

  upstream_port:
    name: Upstream Port
    description: >-
      The port of the backend service.
      Leave empty with upstream host 'homeassistant' to use Home Assistant
      Core's own port as reported by the Supervisor (80 on new Home Assistant
      OS installations since 2026.8, 8123 on older ones).
      Required for any other upstream host.

  mtls_enabled:
    name: Enable mTLS
    description: >-
      Enable mutual TLS (mTLS) authentication.
      When enabled, clients must present a valid certificate to access the service.
      Client certificates can be downloaded from the add-on's web interface.

  ca_country:
    name: CA Country Code
    description: >-
      Two-letter country code for the CA certificate (e.g., US, DE, AT).

  ca_state:
    name: CA State/Province
    description: >-
      State or province name for the CA certificate.

  ca_locality:
    name: CA City/Locality
    description: >-
      City or locality name for the CA certificate.

  ca_organization:
    name: CA Organization
    description: >-
      Organization name for the CA certificate.

  ca_common_name:
    name: CA Common Name
    description: >-
      Common Name (CN) for the CA certificate.
      This is a descriptive name for your certificate authority.

  client_names:
    name: Client Names
    description: >-
      List of client names for certificate generation.
      Each name will get its own .p12 certificate file.
      Use descriptive names like 'john-phone', 'mary-laptop', etc.
      (1-64 characters: letters, digits, '.', '_', '-'; not starting with a dot).
      At every start, a name the add-on does not know yet gets a certificate.
      Removing a name does not revoke its certificate (use Revoke in the
      add-on's web interface), and the name of a revoked client is never
      issued again.

  client_cert_password:
    name: Client Certificate Password
    description: >-
      Password to protect the .p12 certificate files.
      Users will need this password when importing the certificate.
      Choose a strong password and share it securely with your users.
      After a change, the existing certificate files are re-encrypted with
      the new password at the next start - download them again.

  acme_dns_provider:
    name: ACME DNS Provider
    description: >-
      DNS provider for DNS-01 ACME challenge.
      Use this when port 80 is not available for HTTP-01 challenge.
      Supported providers: Cloudflare, Route53 (AWS), Hetzner (Hetzner Console).
      Set to 'none' to use the standard HTTP-01 challenge: it requires
      external TCP port 80 forwarded to this add-on's HTTP host port
      (8080 by default; HTTPS: external 443 to host port 8443 - see the
      add-on's Network settings).

  dns_api_token:
    name: DNS API Token
    description: >-
      API token for the selected DNS provider.

      For Cloudflare: Create an API token with Zone:Read and DNS:Edit permissions.
      For Route53: Use AWS access key format 'ACCESS_KEY_ID:SECRET_ACCESS_KEY'.
      For Hetzner: Create a Hetzner Cloud API token (Read & Write) in the
      Hetzner Console project that holds the DNS zone (tokens of the old
      DNS Console no longer work).

      Leave empty if using HTTP-01 challenge (acme_dns_provider = none),
      which needs external TCP port 80 forwarded to this add-on's HTTP host
      port (8080 by default).

  log_level:
    name: Log Level
    description: >-
      Verbosity for both the add-on init script and the Caddy server.
      One of: trace, debug, info, notice, warning, error, fatal. Default: info.
      With debug or trace, the access logs of Caddy and of the web interface
      are on as well.

  access_log:
    name: Access Log
    description: >-
      Log every request through the proxy (Caddy's access log, one line of
      about 1.5 KB per request - loading the Home Assistant frontend makes
      several hundred). Off by default; turn it on to debug a connection
      problem.

  forwarded_headers:
    name: Forwarding Headers
    description: >-
      Whether Home Assistant gets each visitor's own address
      (X-Forwarded-For). Home Assistant answers "400: Bad Request" when it
      gets one from a proxy it does not trust.
      auto (default): the add-on asks Home Assistant; if it trusts the
      add-on, addresses are passed on; if not, and mTLS is on, they are
      removed and Home Assistant sees every visitor as the add-on.
      always: always passed on (Home Assistant must trust the add-on).
      never: never passed on - only with mTLS on (Enable mTLS); without it
      the add-on refuses to start, because every visitor from the internet
      would look like a device in your local network.
      The add-on's web interface shows the state and how to let Home
      Assistant trust the add-on.

  header_auth_name:
    name: Header Authentication - Header Name
    description: >-
      The name of the header that carries the key (header authentication).
      Default X-Custom-PSK. 1-64 characters: a letter first, then letters,
      digits or '-'. Names that browsers, Home Assistant or the proxy use
      (Authorization, Cookie, X-Forwarded-..., Sec-..., ...) are refused.
      Used only while a key is set.

  header_auth_key:
    name: Header Authentication - Key
    description: >-
      Empty (default): header authentication is off. With a key, a request
      that carries the header above with exactly this key is accepted on the
      public port without a client certificate - for clients that cannot
      present one, such as a watch app. 32 to 256 characters: letters A-Z
      and a-z, digits and . _ ~ + / = - (no blanks). The add-on's web
      interface suggests one; or run: openssl rand -base64 32. Whoever knows
      the key gets as far as Home Assistant's login page; a visitor with
      neither a certificate nor the key gets 403 Forbidden.

network:
  80/tcp: >-
    HTTP (Let's Encrypt HTTP-01, CRL, redirect to HTTPS).
    Router: forward external TCP 80 to this port.
  443/tcp: >-
    HTTPS with mTLS client certificates.
    Router: forward external TCP 443 to this port.
  4443/tcp: >-
    HTTPS for your local network without a client certificate (private
    addresses only). Empty = off. Never forward this port on the router.
