---
# Home Assistant Add-on: Caddy mTLS Proxy
# https://developers.home-assistant.io/docs/add-ons/configuration/

name: "Caddy mTLS Proxy"
version: "2.1.2"
slug: "caddy_mtls"
description: >-
  Caddy reverse proxy with mutual TLS (mTLS) client certificate authentication
  and automatic HTTPS via Let's Encrypt.
url: "https://github.com/LinumIQ/ha-apps/tree/main/caddy-mtls"
image: "ghcr.io/linumiq/{arch}-addon-caddy-mtls"

# Supported architectures
# Note: i386 and armv7 were dropped as they are no longer supported by
# Home Assistant OS / Supervisor.
arch:
  - aarch64
  - amd64

# Use S6-overlay v3 from the community add-ons base image
init: false
startup: services

# Port configuration. Caddy listens on 80/443 inside the container. The
# default HOST ports are 8080/8443: since Home Assistant 2026.8, new Home
# Assistant OS installations serve Home Assistant itself on 80/443, so an
# add-on cannot publish those there. Users forward external 80/443 from the
# router to these host ports (or change them in the add-on's Network
# settings, e.g. back to 80/443 where those are free).
ports:
  "80/tcp": 8080
  "443/tcp": 8443

ports_description:
  "80/tcp": "HTTP (Let's Encrypt HTTP-01, CRL, redirect to HTTPS). Router: forward external TCP 80 to this port."
  "443/tcp": "HTTPS with mTLS client certificates. Router: forward external TCP 443 to this port."

# Ingress configuration for the certificate management web UI (FastAPI app
# served by the cert-mgr s6 service on port 8099 inside the container).
# 8099 is the Supervisor default for ingress_port, so we don't set it
# explicitly (the linter rejects redundant defaults).
ingress: true
ingress_entry: /
panel_icon: mdi:certificate-outline
panel_title: "Caddy mTLS"

# Allow the cert-monitor service to publish sensor entities and persistent
# notifications to Home Assistant via the Supervisor proxy.
hassio_api: true
homeassistant_api: true

# File mappings
map:
  - ssl:rw
  - addon_config:rw

# Add-on options with defaults. upstream_port has no default (since 2.0.0):
# with upstream_host "homeassistant", init-caddy uses Home Assistant Core's
# own port from the Supervisor API (80 on new Home Assistant OS installations
# since 2026.8, 8123 on older ones).
options:
  domain: ""
  email: ""
  upstream_host: "homeassistant"
  mtls_enabled: true
  ca_country: "AT"
  ca_state: "Styria"
  ca_locality: "Graz"
  ca_organization: "LinumIQ"
  ca_common_name: "Home Assistant mTLS CA"
  client_names:
    - "user"
  client_cert_password: "LinumIQ"
  acme_dns_provider: "none"
  dns_api_token: ""
  log_level: "info"
  access_log: false
  cert_expiry_warn_days:
    - 30
    - 14
    - 7
    - 1
  cert_check_interval_hours: 6

# Schema for options validation
schema:
  domain: str
  email: email
  upstream_host: str
  upstream_port: port?
  mtls_enabled: bool
  ca_country: str
  ca_state: str
  ca_locality: str
  ca_organization: str
  ca_common_name: str
  # 1-64 characters (letters, digits, ".", "_", "-"), not starting with a
  # dot - the same rule as init-caddy and the certificate manager panel.
  client_names:
    - "match(^[A-Za-z0-9_-][A-Za-z0-9._-]{0,63}$)"
  client_cert_password: password
  acme_dns_provider: list(none|cloudflare|route53|hetzner)
  dns_api_token: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  access_log: bool
  cert_expiry_warn_days:
    - int(1,365)
  cert_check_interval_hours: int(1,168)

# Seconds Supervisor waits after SIGTERM before it kills the container on a
# stop / restart (docker stop -t). A stop takes about a second: Caddy (at
# most 10 s for open requests, grace_period), uvicorn (3 s) and the monitor
# exit at once on SIGTERM and s6 stops the services in order. 60 s leaves
# room for a slow host; Supervisor's default would be 10.
timeout: 60
