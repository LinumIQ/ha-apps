# Home Assistant Add-on: FRP Tunnel
# English translations for configuration options

configuration:
  log_level:
    name: Log Level
    description: >-
      Verbosity of frpc's own log output (trace, debug, info, warn, error).

  # -------------------------------------------------------------------
  # Advanced / development overrides (hidden in production)
  # -------------------------------------------------------------------
  app_base:
    name: App Base URL (advanced)
    description: >-
      Base URL of the LinumIQ web app used for browser-based device pairing.
      Default is https://app.linumiq.net. Only change this for development
      or testing against a staging environment.

  api_base:
    name: API Base URL (advanced)
    description: >-
      Base URL of the LinumIQ backend API. Default is https://api.linumiq.net.
      Only change this for development or testing.

  server_addr:
    name: FRP Server Address (advanced)
    description: >-
      Hostname or IP of the frps server. Default is linumiq.net.
      Only change this for development or testing.

  server_port:
    name: FRP Server Port (advanced)
    description: >-
      TCP control port of the frps server. Default is 7000.

  domain_base:
    name: Public Domain Base (advanced)
    description: >-
      Domain suffix for the public tunnel hostname (subdomain.<domain_base>).
      Defaults to the FRP server address. Set this separately only when the
      public domain differs from the frps control host, e.g. 'dev.linumiq.net'
      for a development stack.

  local_host:
    name: Local Host (advanced)
    description: >-
      Hostname or IP of the local service to expose. Default is
      'homeassistant' which resolves to Home Assistant Core.

  local_port:
    name: Local Port (advanced)
    description: >-
      TCP port of the local service. Default is 8123 for Home Assistant.
