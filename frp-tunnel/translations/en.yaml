# Home Assistant Add-on: FRP Tunnel
# English translations for configuration options

configuration:
  log_level:
    name: Log Level
    description: >-
      Verbosity of the add-on's log, including frpc's own output
      (trace, debug, info, notice, warning, error, fatal).

  # -------------------------------------------------------------------
  # Advanced / development overrides. Leave empty in production: an
  # override only applies when it is explicitly set.
  # -------------------------------------------------------------------
  app_base:
    name: App Base URL (advanced)
    description: >-
      Base URL of the LinumIQ web app used for browser-based device pairing
      and the device API. Default is https://app.linumiq.net. Only change
      this for development, e.g. https://app-dev.linumiq.net.

  api_base:
    name: API Base URL (advanced)
    description: >-
      Base URL of the LinumIQ backend API. Default is https://api.linumiq.net.
      Only change this for development, e.g. https://api-dev.linumiq.net.

  server_addr:
    name: FRP Server Address (advanced)
    description: >-
      Hostname or IP of the frps server. Normally provided by the LinumIQ
      server during pairing (default linumiq.net). When set, this value
      overrides the server-provided one.

  server_port:
    name: FRP Server Port (advanced)
    description: >-
      TCP control port of the frps server. Normally provided by the LinumIQ
      server during pairing (default 7000; the development stack uses 7001).
      When set, this value overrides the server-provided one.

  domain_base:
    name: Public Domain Base (advanced)
    description: >-
      Domain suffix of the public tunnel hostname (subdomain.<domain_base>).
      Normally provided by the LinumIQ server during pairing; falls back to
      the FRP server address. When set, this value overrides the
      server-provided one, e.g. 'dev.linumiq.net' for the development stack.

  local_host:
    name: Local Host (advanced)
    description: >-
      Hostname or IP of the local service to expose. Default is
      'homeassistant' which resolves to Home Assistant Core.

  local_port:
    name: Local Port (advanced)
    description: >-
      TCP port of the local service. Default is 8123 for Home Assistant.
