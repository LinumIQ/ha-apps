---
# Home Assistant Add-on: FRP Tunnel
# https://developers.home-assistant.io/docs/add-ons/configuration/

name: "FRP Tunnel"
version: "2.0.0"
slug: "frp_tunnel"
description: >-
  Exposes Home Assistant over a persistent reverse tunnel to a remote
  frps server. Pair the add-on with your LinumIQ account using a simple
  browser-based device-authorization flow — no manual tokens or config
  files required. Manage subdomains directly from the ingress panel.
url: "https://github.com/LinumIQ/ha-apps/tree/main/frp-tunnel"

# Supported architectures
arch:
  - aarch64
  - amd64

# Use S6-overlay v3 from the community add-ons base image
init: false
startup: services

# Outbound-only client; no port mappings needed.

# File mappings
map:
  - addon_config:rw

# Ingress panel for device pairing and tunnel management
ingress: true
ingress_entry: /
panel_icon: mdi:lan-connect
panel_title: "FRP Tunnel"

# Add-on options with defaults.
# The only user-facing option is log_level — all tunnel details are
# obtained automatically via the device-authorization flow.
options:
  log_level: "info"

# Advanced / hidden overrides for development and E2E testing.
# In production these are never touched by the user; the FastAPI panel
# drives everything through the browser pairing flow.
schema:
  log_level: list(trace|debug|info|warn|error)?
  # Advanced overrides (optional, production defaults)
  app_base: url?
  api_base: url?
  server_addr: str?
  server_port: port?
  local_host: str?
  local_port: port?

# Resource configuration
timeout: 60
